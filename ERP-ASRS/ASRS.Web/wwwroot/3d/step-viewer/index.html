<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ASRS STEP Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #eef5fb;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #stage {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 20;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      pointer-events: none;
    }

    .pill {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #c8dcea;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: #1f4f6f;
      white-space: nowrap;
    }

    .err {
      color: #8a2f2f;
      border-color: #e6bcbc;
      background: rgba(255, 244, 244, 0.94);
    }

    .hidden { display: none; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.138.3/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.138.3/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/occt-import-js.js"></script>
</head>
<body>
  <div id="stage">
    <div id="hud">
      <div id="filePill" class="pill">Dosya: -</div>
      <div id="statusPill" class="pill">Durum: başlatılıyor...</div>
      <div id="errorPill" class="pill err hidden"></div>
    </div>
  </div>

  <script>
    (async function () {
      const stage = document.getElementById('stage');
      const filePill = document.getElementById('filePill');
      const statusPill = document.getElementById('statusPill');
      const errorPill = document.getElementById('errorPill');

      const params = new URLSearchParams(window.location.search);
      const fileUrl = params.get('file') || '/models/asrs-system.step';
      filePill.textContent = `Dosya: ${fileUrl}`;

      function setStatus(text) {
        statusPill.textContent = `Durum: ${text}`;
      }

      function setError(text) {
        errorPill.textContent = text;
        errorPill.classList.remove('hidden');
      }

      function buildMesh(geometryMesh, showEdges) {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(geometryMesh.attributes.position.array, 3));

        if (geometryMesh.attributes.normal) {
          geometry.setAttribute('normal', new THREE.Float32BufferAttribute(geometryMesh.attributes.normal.array, 3));
        }

        const index = Uint32Array.from(geometryMesh.index.array);
        geometry.setIndex(new THREE.BufferAttribute(index, 1));

        const defaultMaterial = new THREE.MeshPhongMaterial({
          color: geometryMesh.color
            ? new THREE.Color(geometryMesh.color[0], geometryMesh.color[1], geometryMesh.color[2])
            : new THREE.Color(0.78, 0.82, 0.86),
          specular: 0,
          shininess: 30
        });

        const materials = [defaultMaterial];
        const outlineMaterial = new THREE.LineBasicMaterial({ color: 0x2a5874 });
        const edges = showEdges ? new THREE.Group() : null;

        if (geometryMesh.brep_faces && geometryMesh.brep_faces.length > 0) {
          for (const faceColor of geometryMesh.brep_faces) {
            const color = faceColor.color
              ? new THREE.Color(faceColor.color[0], faceColor.color[1], faceColor.color[2])
              : defaultMaterial.color;
            materials.push(new THREE.MeshPhongMaterial({ color, specular: 0, shininess: 30 }));
          }

          const triangleCount = geometryMesh.index.array.length / 3;
          let triangleIndex = 0;
          let faceColorGroupIndex = 0;

          while (triangleIndex < triangleCount) {
            const firstIndex = triangleIndex;
            let lastIndex = null;
            let materialIndex = null;

            if (faceColorGroupIndex >= geometryMesh.brep_faces.length) {
              lastIndex = triangleCount;
              materialIndex = 0;
            } else if (triangleIndex < geometryMesh.brep_faces[faceColorGroupIndex].first) {
              lastIndex = geometryMesh.brep_faces[faceColorGroupIndex].first;
              materialIndex = 0;
            } else {
              lastIndex = geometryMesh.brep_faces[faceColorGroupIndex].last + 1;
              materialIndex = faceColorGroupIndex + 1;
              faceColorGroupIndex++;
            }

            geometry.addGroup(firstIndex * 3, (lastIndex - firstIndex) * 3, materialIndex);
            triangleIndex = lastIndex;

            if (edges) {
              const innerGeometry = new THREE.BufferGeometry();
              innerGeometry.setAttribute('position', geometry.attributes.position);
              if (geometryMesh.attributes.normal) {
                innerGeometry.setAttribute('normal', geometry.attributes.normal);
              }
              innerGeometry.setIndex(new THREE.BufferAttribute(index.slice(firstIndex * 3, lastIndex * 3), 1));
              const innerEdgesGeometry = new THREE.EdgesGeometry(innerGeometry, 180);
              const edge = new THREE.LineSegments(innerEdgesGeometry, outlineMaterial);
              edges.add(edge);
            }
          }
        }

        const mesh = new THREE.Mesh(geometry, materials.length > 1 ? materials : materials[0]);
        if (edges) {
          edges.renderOrder = mesh.renderOrder + 1;
        }
        return { mesh, edges };
      }

      try {
        setStatus('sahne kuruluyor');

        const width = stage.clientWidth || window.innerWidth;
        const height = stage.clientHeight || window.innerHeight;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.setSize(width, height);
        renderer.setClearColor(0xeef5fb);
        stage.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, width / height, 1.0, 200000.0);
        camera.position.set(5000, 9000, 6500);
        camera.up.set(0, 0, 1);
        camera.lookAt(new THREE.Vector3(0, 0, 0));

        const scene = new THREE.Scene();

        const ambientLight = new THREE.AmbientLight(0x555555);
        scene.add(ambientLight);

        const keyLight = new THREE.DirectionalLight(0xdddddd, 0.95);
        keyLight.position.set(9000, 11000, 8000);
        scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xb4c9d8, 0.35);
        fillLight.position.set(-7000, -5000, 4000);
        scene.add(fillLight);

        const grid = new THREE.GridHelper(7000, 28, 0x92b0c4, 0xc4d8e5);
        grid.rotation.x = Math.PI / 2;
        scene.add(grid);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.07;
        controls.minDistance = 200;
        controls.maxDistance = 80000;

        setStatus('STEP yükleniyor');
        const response = await fetch(fileUrl);
        if (!response.ok) {
          throw new Error(`STEP dosyası okunamadı (${response.status})`);
        }

        const buffer = await response.arrayBuffer();
        const fileBuffer = new Uint8Array(buffer);

        setStatus('STEP parse ediliyor');
        const occt = await occtimportjs();
        const result = occt.ReadStepFile(fileBuffer, null);

        if (!result || !result.success || !Array.isArray(result.meshes) || result.meshes.length === 0) {
          throw new Error('STEP parse başarısız veya mesh bulunamadı.');
        }

        setStatus('meshler oluşturuluyor');
        const mainObject = new THREE.Object3D();
        for (const resultMesh of result.meshes) {
          const { mesh, edges } = buildMesh(resultMesh, true);
          mainObject.add(mesh);
          if (edges) {
            mainObject.add(edges);
          }
        }

        scene.add(mainObject);

        // STEP dosyalarinda up-axis farkli gelebilir (Y-up / Z-up vb.).
        // Bu blok modeli "en dik" hale getirmek icin otomatik yon denemesi yapar.
        const orientations = [
          new THREE.Euler(0, 0, 0),
          new THREE.Euler(-Math.PI / 2, 0, 0),
          new THREE.Euler(Math.PI / 2, 0, 0),
          new THREE.Euler(0, -Math.PI / 2, 0),
          new THREE.Euler(0, Math.PI / 2, 0),
          new THREE.Euler(Math.PI, 0, 0)
        ];

        let bestEuler = orientations[0];
        let bestScore = -Infinity;

        for (const euler of orientations) {
          mainObject.rotation.set(euler.x, euler.y, euler.z);
          mainObject.updateMatrixWorld(true);
          const trialBox = new THREE.Box3().setFromObject(mainObject);
          const trialSize = trialBox.getSize(new THREE.Vector3());
          // Dikey eksende (Z) daha buyuk yayilim -> daha "dik" gorunum
          const score = trialSize.z - 0.25 * Math.abs(trialSize.x - trialSize.y);
          if (score > bestScore) {
            bestScore = score;
            bestEuler = euler;
          }
        }

        mainObject.rotation.set(bestEuler.x, bestEuler.y, bestEuler.z);
        mainObject.updateMatrixWorld(true);

        // Bazi STEP'lerde ilk deneme yine "yatik" kalabilir.
        // Bu durumda ek 90 derece rotasyon adaylari arasindan en dik olani sec.
        const uprightCandidates = [
          new THREE.Euler(0, 0, 0),
          new THREE.Euler(-Math.PI / 2, 0, 0),
          new THREE.Euler(Math.PI / 2, 0, 0),
          new THREE.Euler(0, -Math.PI / 2, 0),
          new THREE.Euler(0, Math.PI / 2, 0)
        ];

        let bestUpright = uprightCandidates[0];
        let bestUprightScore = -Infinity;
        const baseEuler = new THREE.Euler(bestEuler.x, bestEuler.y, bestEuler.z);

        for (const add of uprightCandidates) {
          mainObject.rotation.set(baseEuler.x + add.x, baseEuler.y + add.y, baseEuler.z + add.z);
          mainObject.updateMatrixWorld(true);
          const uprightBox = new THREE.Box3().setFromObject(mainObject);
          const uprightSize = uprightBox.getSize(new THREE.Vector3());
          const footprint = Math.max(uprightSize.x, uprightSize.y) || 1;
          const zRatio = uprightSize.z / footprint;
          if (zRatio > bestUprightScore) {
            bestUprightScore = zRatio;
            bestUpright = add;
          }
        }

        mainObject.rotation.set(
          baseEuler.x + bestUpright.x,
          baseEuler.y + bestUpright.y,
          baseEuler.z + bestUpright.z
        );
        // Bu model ailesinde "ters" gorunum olustugu icin global bir flip uyguluyoruz.
        // Gerekirse dashboarddan bu offset sonradan parametreye baglanabilir.
        mainObject.rotateX(Math.PI);
        mainObject.updateMatrixWorld(true);

        // Modeli zemin referansina oturt:
        // X/Y merkezde kalsin, modelin en alt noktasi Z=0'a gelsin.
        const box = new THREE.Box3().setFromObject(mainObject);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        mainObject.position.x -= center.x;
        mainObject.position.y -= center.y;
        mainObject.position.z -= box.min.z;
        mainObject.updateMatrixWorld(true);

        const maxDim = Math.max(size.x, size.y, size.z) || 1000;
        const fitDistance = maxDim * 1.25;
        const targetZ = Math.max(80, size.z * 0.45);
        camera.position.set(fitDistance, fitDistance, fitDistance * 0.95);
        camera.lookAt(new THREE.Vector3(0, 0, targetZ));
        controls.target.set(0, 0, targetZ);
        controls.update();

        setStatus(`hazır (${result.meshes.length} mesh)`);

        function animate() {
          controls.update();
          renderer.render(scene, camera);
          requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
          const w = stage.clientWidth || window.innerWidth;
          const h = stage.clientHeight || window.innerHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        });
      } catch (err) {
        setStatus('hata');
        setError(err && err.message ? err.message : 'Bilinmeyen hata oluştu.');
        console.error('STEP viewer error:', err);
      }
    })();
  </script>
</body>
</html>
